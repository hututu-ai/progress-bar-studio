interface:
  display_name: "ElleFlow｜小人走路视频进度条动画"
  short_description: "按 8 步选择，无痛做高清透明章节进度条"
  default_prompt: "为我拖进来的 720p 轻量分析版做一个 ElleFlow 章节进度条。它只用来理解内容和拆分章节，最后请交付一条能叠加回我高清原工程的透明进度条。严格按 Step 1-8 一步一步引导我：每次回复只问一个问题，用“进度 X/8”标明当前步骤，给我 2-5 个 A/B/C 选择；我可以回复字母、数字或自然语言，也可以随时说“改一下”或“返回上一步”。先确认章节，再依次确认角色、样式、颜色、是否保存预设、透明进度条清晰度与位置、总预览、15 秒样片；样片确认后再导出完整透明 MOV。"
