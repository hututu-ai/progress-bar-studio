interface:
  display_name: "ElleFlow｜小人走路视频进度条动画"
  short_description: "首步可整套复用，按内容生成高清透明章节进度条"
  default_prompt: "为我拖进来的 720p 轻量分析版做一个 ElleFlow 章节进度条。先检查是否有上次已确认的完整预设；如果有，第一步先问我是否整套沿用角色、精确样式、配色、大小和位置，确认沿用后不要重复询问这些字段，但必须按新视频重新分析章节。3分钟内通常3–5段，语义转折清晰时可到6–7段，长视频按内容密度增加，不按时长平均切分。每次回复只问一个问题，用“进度 X/8”标明当前步骤；样片确认后再导出完整透明 MOV。"
