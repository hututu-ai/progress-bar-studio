interface:
  display_name: "ElleFlow｜小人走路视频进度条动画"
  short_description: "用轻量分析版无痛做高清透明章节进度条"
  default_prompt: "给我拖进来的 720p 轻量分析版做一个 ElleFlow 章节进度条。它只用来理解内容和拆分章节，最后请交付一条能叠加回我高清原工程的透明进度条。先自动理解内容并给我确认章节拆分；确认后问我要不要小人走路，不需要就直接进入样式和颜色，需要就让我上传 IP 图并先确认走路形象。接着让我选择 4 种样式或自定义参考图、选择颜色或上传图片提取配色，并问我是否保存为个人预设。最后确认透明进度条的输出位置和清晰度，先做 15 秒透明样片，样片确认后再导出完整透明 MOV。"
